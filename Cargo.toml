[workspace]
resolver = "2"
members = [
  "crates/dictto-core",
  "crates/dictto-windows",
  "apps/native",
  "apps/gnome",
  "apps/gnome-settings",
  "apps/desktop/src-tauri",
]
# The other members build on Windows only; a plain `cargo build` stays portable.
default-members = ["crates/dictto-core"]

# Without this, partitioning noise in the core alone pushed the native exe past its size budget.
[profile.release.package.dictto-core]
codegen-units = 1

# The core's generic microphone route is instantiated here; split across 16 units it
# added about 26 KB to the native exe.
[profile.release.package.dictto-windows]
codegen-units = 1
