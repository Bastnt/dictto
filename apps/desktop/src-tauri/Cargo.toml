[package]
name = "dictto"
version = "0.2.0"
description = "Voice-to-text desktop app"
authors = ["Fabian Cronhenko"]
edition = "2021"

[lib]
name = "dictto_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-clipboard-manager = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }

dictto-core = { path = "../../../crates/dictto-core" }
dictto-windows = { path = "../../../crates/dictto-windows" }
log = { version = "0.4", features = ["max_level_debug", "release_max_level_warn"] }
tauri-plugin-log = "2"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging"] }
