[package]
name = "dictto-native"
version = "0.2.0"
edition = "2021"
description = "Native Windows 11 interface for Dictto"
build = "build.rs"

[features]
default = []
tauri-host = []

[dependencies]
windows-reactor = "=0.100.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.13", features = ["json", "multipart"] }
rusqlite = { version = "0.38", features = ["bundled"] }
hound = "3.5"
enigo = "0.6"
arboard = "3"
sys-locale = "0.3.2"
keyring = { version = "3", features = ["windows-native"] }
async-trait = "0.1"
thiserror = "2"
log = "0.4"
winreg = "0.55"
windows-core = "0.62"
windows = { version = "0.62", features = [
  "Win32_Foundation", "Win32_UI_WindowsAndMessaging",
  "Win32_UI_Input_KeyboardAndMouse", "Win32_Media_Audio",
  "Win32_System_Com", "Win32_System_Com_StructuredStorage",
  "Win32_Devices_Properties", "Win32_UI_Shell_PropertiesSystem",
  "Win32_System_Variant", "Win32_Security", "Win32_System_Threading",
  "Win32_System_LibraryLoader", "Win32_Graphics_Gdi", "Win32_UI_HiDpi", "Win32_UI_Shell",
] }

[build-dependencies]
windows-reactor-setup = "=0.100.0"
