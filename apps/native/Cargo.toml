[package]
name = "dictto-native"
version = "0.2.0"
edition = "2021"
description = "Lightweight Win32 interface for Dictto"
build = "build.rs"

[features]
default = []
tauri-host = []

[dependencies]
serde_json = "1"
reqwest = { version = "0.13", features = ["json", "multipart"] }
dictto-core = { path = "../../crates/dictto-core", features = ["speech"] }
dictto-windows = { path = "../../crates/dictto-windows", features = ["speech"] }
thiserror = "2"
log = "0.4"
winreg = "0.55"
windows = { version = "0.62", features = [
  "Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse",
  "Win32_System_LibraryLoader", "Win32_Graphics_Gdi", "Win32_UI_HiDpi", "Win32_UI_Shell",
  "Win32_System_RemoteDesktop", "Win32_UI_Controls", "Win32_Graphics_Dwm",
] }

[build-dependencies]
winresource = "0.1"
