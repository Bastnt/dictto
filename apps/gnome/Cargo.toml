[package]
name = "dictto-gnome"
version = "0.2.0"
edition = "2021"
description = "Native Dictto for Fedora GNOME (Wayland)"

[dependencies]
dictto-core = { path = "../../crates/dictto-core", features = ["speech"] }
log = "0.4"

[target.'cfg(target_os = "linux")'.dependencies]
# Same major as dictto-core; without a Secret Service backend keyring falls back to a
# mock store and saved API keys vanish on exit.
keyring = { version = "3", features = ["sync-secret-service", "crypto-rust"] }
evdev = { version = "0.13", features = ["tokio"] }
inotify = { version = "0.11", default-features = false }
tokio = { version = "1", features = ["net", "macros", "sync", "time"] }
zbus = { version = "5", default-features = false, features = ["tokio"] }
futures-util = { version = "0.3", default-features = false }
thiserror = "2"
# v0_3_49 for pw_buffer.requested; Fedora and Ubuntu ship 1.x.
pipewire = { version = "0.10", features = ["v0_3_49"] }
hound = "3.5"
async-trait = "0.1"
serde_json = "1"
