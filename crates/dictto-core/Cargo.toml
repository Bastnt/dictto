[package]
name = "dictto-core"
version = "0.2.0"
edition = "2021"
description = "Platform-neutral core shared by the Dictto apps"

[features]
default = []
speech = ["dep:ring"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.13", features = ["json", "multipart"] }
rusqlite = { version = "0.38", features = ["bundled"] }
hound = "3.5"
sys-locale = "0.3.2"
keyring = "3"
async-trait = "0.1"
thiserror = "2"
log = "0.4"
ring = { version = "0.17", optional = true }
