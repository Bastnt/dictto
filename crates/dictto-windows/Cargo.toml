[package]
name = "dictto-windows"
version = "0.2.0"
edition = "2021"
description = "Windows platform services shared by the Dictto apps"

[dependencies]
dictto-core = { path = "../dictto-core" }
keyring = { version = "3", features = ["windows-native"] }
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging"] }
